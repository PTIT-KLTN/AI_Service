version: '3.8'

services:
  # ======================== RabbitMQ Server ========================
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ai_service_rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ai_service_network
    restart: unless-stopped

  # ======================== RabbitMQ Worker (Optimized) ========================
  ai_service_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_service_worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # ============ RabbitMQ Configuration ============
      AMQP_URL: amqp://admin:admin123@rabbitmq:5672/
      REQUEST_QUEUE: recipe_analysis_request
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      PROCESS_TIMEOUT_SEC: ${PROCESS_TIMEOUT_SEC:-100}
      RESULTS_DLX: dlx.results
      RESULTS_DLQ: dlq.results
      MESSAGE_TTL_MS: 300000
      
      # ============ Pipeline Configuration (Optimized) ============
      USE_OPTIMIZED_PIPELINE: "true"
      RECIPE_CACHE_TTL: ${RECIPE_CACHE_TTL:-3600}
      RECIPE_CACHE_MAXSIZE: ${RECIPE_CACHE_MAXSIZE:-1000}
      OPTIMIZED_MAX_WORKERS: ${OPTIMIZED_MAX_WORKERS:-3}
      LOG_CACHE_STATS: "true"
      CACHE_STATS_INTERVAL: 300
      
      # ============ AWS Configuration ============
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      
      # S3 Configuration
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${AWS_DEFAULT_REGION}
      
      # Bedrock Configuration
      BEDROCK_KB_ID: ${BEDROCK_KB_ID}
      INVOKE_MODEL_ID: ${INVOKE_MODEL_ID}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      VISION_MODEL_ID: ${VISION_MODEL_ID}
      
      # ============ Logging ============
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    
    volumes:
      - ./app:/app/app
      - ./run_rabbitmq_worker.py:/app/run_rabbitmq_worker.py
      - worker_logs:/app/logs
    
    command: python run_rabbitmq_worker.py
    
    networks:
      - ai_service_network
    
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    labels:
      - "com.aiservice.type=worker"
      - "com.aiservice.pipeline=optimized"

volumes:
  rabbitmq_data:
    driver: local
  worker_logs:
    driver: local

networks:
  ai_service_network:
    driver: bridge